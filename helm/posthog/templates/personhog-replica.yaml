apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.fullname" . }}-personhog-replica
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ include "posthog.fullname" . }}-personhog-replica }
  ports:
    - { name: grpc, port: 50051, targetPort: 50051, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.fullname" . }}-personhog-replica
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.personhogReplica.replicas }}
  selector: { matchLabels: { app: {{ include "posthog.fullname" . }}-personhog-replica } }
  template:
    metadata: { labels: { app: {{ include "posthog.fullname" . }}-personhog-replica } }
    spec:
      containers:
        - name: personhog-replica
          image: {{ .Values.images.personhogReplica | quote }}
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:50051"
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: "9100"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-password } }
            - name: POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-endpoint } }
            - name: POSTGRES_PORT
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-port } }
            - name: PRIMARY_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
          ports: [{ containerPort: 50051 }]
          resources:
            requests:
              cpu:    {{ (index .Values.defaultResources .Values.personhogReplica.resourcesTier).requests.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.personhogReplica.resourcesTier).requests.memory | quote }}
            limits:
              cpu:    {{ (index .Values.defaultResources .Values.personhogReplica.resourcesTier).limits.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.personhogReplica.resourcesTier).limits.memory | quote }}

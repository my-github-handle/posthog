apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.fullname" . }}-feature-flags
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "posthog.fullname" . }}-feature-flags-bc"}'
spec:
  type: NodePort
  selector: { app: {{ include "posthog.fullname" . }}-feature-flags }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "posthog.fullname" . }}-feature-flags-bc
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  securityPolicy:
    name: {{ .Values.cloudArmorPolicy | quote }}
  healthCheck:
    type: HTTP
    requestPath: /_readiness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.fullname" . }}-feature-flags
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.featureFlags.replicas }}
  selector: { matchLabels: { app: {{ include "posthog.fullname" . }}-feature-flags } }
  template:
    metadata:
      labels: { app: {{ include "posthog.fullname" . }}-feature-flags }
    spec:
      {{- if .Values.maxmindDb.enabled }}
      initContainers:
        - name: maxmind-download
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              set -e
              echo "Downloading MaxMind GeoLite2-City.mmdb..."
              curl -sL "{{ .Values.maxmindDb.downloadUrl }}" -o /share/GeoLite2-City.mmdb
              ls -la /share/GeoLite2-City.mmdb
          volumeMounts:
            - { name: share, mountPath: /share }
      volumes:
        - { name: share, emptyDir: {} }
      {{- end }}
      containers:
        - name: feature-flags
          image: {{ .Values.images.featureFlags | quote }}
          env:
            - { name: ADDRESS,           value: "0.0.0.0:3001" }
            - { name: RUST_LOG,          value: "info" }
            - { name: MAXMIND_DB_PATH,   value: "/share/GeoLite2-City.mmdb" }
            # Postgres env block (shared pattern from posthog-web.yaml)
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-password } }
            - name: POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-endpoint } }
            - name: POSTGRES_PORT
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-port } }
            - name: WRITE_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
            - name: READ_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
            - name: PERSONS_WRITE_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
            - name: PERSONS_READ_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
            # Shared Redis for team cache + flags cache (Mode 1: shared-only per upstream docker-compose.base.yml)
            - { name: REDIS_URL,              value: {{ printf "redis://%s-redis:6379/" (include "posthog.fullname" .) | quote }} }
            # Cookieless (required by feature-flags Rust service)
            - { name: COOKIELESS_REDIS_HOST,  value: {{ printf "%s-redis" (include "posthog.fullname" .) | quote }} }
            - { name: COOKIELESS_REDIS_PORT,  value: "6379" }
          ports: [{ containerPort: 3001 }]
          {{- if .Values.maxmindDb.enabled }}
          volumeMounts:
            - { name: share, mountPath: /share }
          {{- end }}
          resources:
            requests:
              cpu:    {{ (index .Values.defaultResources .Values.featureFlags.resourcesTier).requests.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.featureFlags.resourcesTier).requests.memory | quote }}
            limits:
              cpu:    {{ (index .Values.defaultResources .Values.featureFlags.resourcesTier).limits.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.featureFlags.resourcesTier).limits.memory | quote }}
          readinessProbe:
            httpGet: { path: /_readiness, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10

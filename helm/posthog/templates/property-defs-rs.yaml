apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.fullname" . }}-property-defs-rs
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.propertyDefsRs.replicas }}
  selector: { matchLabels: { app: {{ include "posthog.fullname" . }}-property-defs-rs } }
  template:
    metadata:
      labels: { app: {{ include "posthog.fullname" . }}-property-defs-rs }
      annotations:
        checksum/app-secret: {{ include (print $.Template.BasePath "/app-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: property-defs-rs
          image: {{ .Values.images.propertyDefsRs | quote }}
          env:
            - name: KAFKA_HOSTS
              value: {{ .Values.kafka.hosts | quote }}
            - name: KAFKA_CONSUMER_TOPIC
              value: {{ include "posthog.kafkaTopic" (dict "ctx" . "topic" "clickhouse_events_json") | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: "property-defs-rs"
            - name: SKIP_WRITES
              value: "false"
            - name: SKIP_READS
              value: "false"
            - name: FILTER_MODE
              value: "opt-out"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-admin-password } }
            - name: POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-endpoint } }
            - name: POSTGRES_PORT
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.adminSecretName | quote }}, key: postgres-db-port } }
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
          resources:
            requests:
              cpu:    {{ (index .Values.defaultResources .Values.propertyDefsRs.resourcesTier).requests.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.propertyDefsRs.resourcesTier).requests.memory | quote }}
            limits:
              cpu:    {{ (index .Values.defaultResources .Values.propertyDefsRs.resourcesTier).limits.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.propertyDefsRs.resourcesTier).limits.memory | quote }}

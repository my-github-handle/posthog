apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-asyncmigrations-check
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: asyncmigrations-check
          image: {{ .Values.images.web | quote }}
          command:
            - bash
            - -c
            - |
              set -e
              echo "=== complete unnecessary async migrations (fresh install) ==="
              python manage.py run_async_migrations --complete-noop || true
              echo "=== async migrations check ==="
              python manage.py run_async_migrations --check || echo "check failed but proceeding"
              echo "=== done ==="
          envFrom:
            - secretRef:
                name: {{ include "posthog.fullname" . }}-app-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.adminSecretName | quote }}
                  key: postgres-admin-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.adminSecretName | quote }}
                  key: postgres-admin-password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.adminSecretName | quote }}
                  key: postgres-db-endpoint
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.adminSecretName | quote }}
                  key: postgres-db-port
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
            - name: PERSONS_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/{{ .Values.postgres.database }}"
          resources:
            requests:
              cpu:    {{ (index .Values.defaultResources .Values.asyncMigrationsCheck.resourcesTier).requests.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.asyncMigrationsCheck.resourcesTier).requests.memory | quote }}
            limits:
              cpu:    {{ (index .Values.defaultResources .Values.asyncMigrationsCheck.resourcesTier).limits.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.asyncMigrationsCheck.resourcesTier).limits.memory | quote }}

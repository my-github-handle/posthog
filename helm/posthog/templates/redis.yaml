apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.fullname" . }}-redis
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "posthog.fullname" . }}-redis
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "posthog.fullname" . }}-redis
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "posthog.fullname" . }}-redis
  replicas: 1
  selector: { matchLabels: { app: {{ include "posthog.fullname" . }}-redis } }
  template:
    metadata:
      labels: { app: {{ include "posthog.fullname" . }}-redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports: [{ containerPort: 6379 }]
          args: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | quote }}
              memory: {{ .Values.redis.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu | quote }}
              memory: {{ .Values.redis.resources.limits.memory | quote }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.redis.storageSize | quote }} } }

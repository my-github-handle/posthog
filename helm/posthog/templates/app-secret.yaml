apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posthog.fullname" . }}-app-secrets
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # --- Django core ---
  SECRET_KEY: {{ required "secrets.djangoSecretKey is required - pass via --set-string" .Values.secrets.djangoSecretKey | quote }}
  ENCRYPTION_SALT_KEYS: {{ required "secrets.encryptionSaltKeys required (32 raw chars, selfhog #4)" .Values.secrets.encryptionSaltKeys | quote }}
  # --- Django migration/startup safety ---
  SKIP_SERVICE_VERSION_REQUIREMENTS: "1"
  # --- Postgres (DATABASE_URL / PERSONS_DATABASE_URL are synthesized per-Deployment via env-var interpolation; not in this Secret) ---
  # --- ClickHouse ---
  # Altinity operator emits the service as "clickhouse-<chi-name>"; prepend "clickhouse-" to posthog.fullname-clickhouse
  CLICKHOUSE_HOST: {{ printf "clickhouse-%s-clickhouse" (include "posthog.fullname" .) | quote }}
  CLICKHOUSE_CLUSTER: "posthog"
  CLICKHOUSE_MIGRATIONS_CLUSTER: "posthog"
  CLICKHOUSE_SATELLITE_CLUSTERS: "posthog"
  CLICKHOUSE_SINGLE_SHARD_CLUSTER: "posthog"
  CLICKHOUSE_WRITABLE_CLUSTER: "posthog"
  CLICKHOUSE_PRIMARY_REPLICA_CLUSTER: "posthog"
  CLICKHOUSE_AUX_CLUSTER: "posthog"
  CLICKHOUSE_AI_EVENTS_CLUSTER: "posthog"
  CLICKHOUSE_LOGS_CLUSTER: "posthog"
  CLICKHOUSE_DATABASE: "posthog"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_REPLICATION: "false"
  # --- Kafka (shared) ---
  KAFKA_HOSTS: {{ .Values.kafka.hosts | quote }}
  KAFKA_PREFIX: {{ .Values.kafka.topicPrefix | quote }}
  # --- Redis (auth) ---
  REDIS_URL: {{ printf "redis://%s-redis:6379/" (include "posthog.fullname" .) | quote }}
  CDP_REDIS_URL: {{ printf "redis://%s-redis:6379/" (include "posthog.fullname" .) | quote }}
  CDP_REDIS_HOST: {{ printf "%s-redis" (include "posthog.fullname" .) | quote }}
  CDP_REDIS_PORT: "6379"
  CDP_REDIS_PASSWORD: ""
  # --- Redis CDP (no auth) - selfhog #3 ---
  LOGS_REDIS_HOST: {{ printf "%s-redis-cdp" (include "posthog.fullname" .) | quote }}
  LOGS_REDIS_PORT: "6379"
  LOGS_REDIS_PASSWORD: ""
  LOGS_REDIS_TLS: "false"
  TRACES_REDIS_HOST: {{ printf "%s-redis-cdp" (include "posthog.fullname" .) | quote }}
  TRACES_REDIS_PORT: "6379"
  TRACES_REDIS_PASSWORD: ""
  TRACES_REDIS_TLS: "false"
  # --- GCS (S3-compat object storage) - HMAC creds come via posthog-gcs-hmac ExternalSecret ---
  OBJECT_STORAGE_ENDPOINT: {{ .Values.gcs.endpoint | quote }}
  OBJECT_STORAGE_BUCKET: {{ .Values.gcs.bucket | quote }}
  OBJECT_STORAGE_SESSION_RECORDING_FOLDER: {{ .Values.gcs.sessionRecordingFolder | quote }}
  # --- Django proxy/CSRF (selfhog #9) ---
  SITE_URL: "https://{{ .Values.hostname }}"
  IS_BEHIND_PROXY: "True"
  TRUST_ALL_PROXIES: "True"
  DISABLE_SECURE_SSL_REDIRECT: "False"
  CSRF_TRUSTED_ORIGINS: "https://{{ .Values.hostname }}"
  ALLOWED_HOSTS: "*"
  # --- CDP_API_URL → recording-api Service (plugin-server deprecated per Batch H4) ---
  CDP_API_URL: {{ printf "http://%s-recording-api:6738" (include "posthog.fullname" .) | quote }}
  # --- Migration safety ---
  POSTHOG_SKIP_MIGRATION_CHECKS: "1"
  SKIP_ASYNC_MIGRATIONS_SETUP: "1"

apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.fullname" . }}-replay-capture
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "posthog.fullname" . }}-replay-capture-bc"}'
spec:
  type: NodePort
  selector: { app: {{ include "posthog.fullname" . }}-replay-capture }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.fullname" . }}-replay-capture
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replayCapture.replicas }}
  selector: { matchLabels: { app: {{ include "posthog.fullname" . }}-replay-capture } }
  template:
    metadata:
      labels: { app: {{ include "posthog.fullname" . }}-replay-capture }
      annotations:
        checksum/app-secret: {{ include (print $.Template.BasePath "/app-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: replay-capture
          image: {{ .Values.images.replayCapture | quote }}
          envFrom:
            - secretRef: { name: {{ .Values.gcs.hmacSecretName }} }
          env:
            - name: ADDRESS
              value: "0.0.0.0:3000"
            - name: KAFKA_TOPIC
              value: {{ include "posthog.kafkaTopic" (dict "ctx" . "topic" .Values.kafkaTopics.sessionRecordingSnapshots) | quote }}
            - name: KAFKA_HOSTS
              value: {{ .Values.kafka.hosts | quote }}
            - name: REDIS_URL
              value: {{ printf "redis://%s-redis:6379/" (include "posthog.fullname" .) | quote }}
            - name: CAPTURE_MODE
              value: "recordings"
            - name: RUST_LOG
              value: "info,rdkafka=warn"
            - name: SESSION_RECORDING_V2_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "posthog.fullname" . }}-app-secrets
                  key: OBJECT_STORAGE_ENDPOINT
            - name: SESSION_RECORDING_V2_S3_TIMEOUT_MS
              value: "120000"
            - name: SESSION_RECORDING_V2_S3_FORCE_PATH_STYLE
              value: "true"
          ports: [{ containerPort: 3000 }]
          resources:
            requests:
              cpu:    {{ (index .Values.defaultResources .Values.replayCapture.resourcesTier).requests.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.replayCapture.resourcesTier).requests.memory | quote }}
            limits:
              cpu:    {{ (index .Values.defaultResources .Values.replayCapture.resourcesTier).limits.cpu | quote }}
              memory: {{ (index .Values.defaultResources .Values.replayCapture.resourcesTier).limits.memory | quote }}
          readinessProbe:
            httpGet: { path: /_readiness, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_liveness, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
